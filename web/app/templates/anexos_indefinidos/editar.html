{% extends "base.html" %}

{% block title %}Editar anexo indefinido · #{{ anexo.id }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div>
      <h1 class="card-title">Editar anexo a indefinido</h1>
      <p class="card-subtitle">
        Anexo <strong>#{{ anexo.id }}</strong> · Contrato <strong>#{{ contrato.id }}</strong>
      </p>
    </div>
    <div class="card-actions">
      <a href="{{ url_for('anexos_indefinidos.detalle', anexo_id=anexo.id) }}" class="btn btn-outline-secondary">
        ⬅ Volver
      </a>
    </div>
  </div>

  <div class="card-body">
    <form method="post" action="{{ url_for('anexos_indefinidos.editar_post', anexo_id=anexo.id) }}" class="form">
      <div class="form-grid">
        <div class="form-group">
          <label for="fecha_anexo">Fecha del anexo</label>
          <input type="date" id="fecha_anexo" name="fecha_anexo"
                 value="{{ anexo.fecha_anexo.isoformat() if anexo.fecha_anexo else '' }}">
        </div>

        <div class="form-group">
          <label for="fecha_termino_referencial">Fecha término referencial</label>
          <input type="date" id="fecha_termino_referencial" name="fecha_termino_referencial"
                 value="{{ anexo.fecha_termino_referencial.isoformat() if anexo.fecha_termino_referencial else '' }}">
        </div>

        <div class="form-group">
          <label for="fecha_indefinido_desde">Pasa a indefinido desde</label>
          <input type="date" id="fecha_indefinido_desde" name="fecha_indefinido_desde" required
                 value="{{ anexo.fecha_indefinido_desde.isoformat() if anexo.fecha_indefinido_desde else '' }}">
        </div>

        <div class="form-group">
          <label for="formato">Formato</label>
          <select id="formato" name="formato">
            <option value="AMBOS" {% if (anexo.formato or '') == 'AMBOS' %}selected{% endif %}>AMBOS</option>
            <option value="DOCX" {% if (anexo.formato or '') == 'DOCX' %}selected{% endif %}>DOCX</option>
            <option value="PDF" {% if (anexo.formato or '') == 'PDF' %}selected{% endif %}>PDF</option>
          </select>
        </div>

        <div class="form-group col-12">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" name="observaciones" rows="3">{{ anexo.observaciones or '' }}</textarea>
        </div>
      </div>

      <div class="mt-3 d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
        <a href="{{ url_for('anexos_indefinidos.detalle', anexo_id=anexo.id) }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
