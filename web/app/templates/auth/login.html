{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo">
        <img src="{{ url_for('static', filename='img/grupo_cs_logo.png') }}" alt="Grupo CS">
        <div>
          <h1 class="auth-title">Ingreso al Sistema RRHH</h1>
          <p class="auth-subtitle">
            {{ config.SYSTEM_NAME or "Sistema Grupo CS" }} ·
            {{ config.SYSTEM_TAGLINE or "Gestión de Recursos Humanos" }}
          </p>
        </div>
      </div>

      <span class="auth-badge">Acceso con usuario y contraseña</span>
    </div>

    <div class="auth-card-body">
      <form method="POST" action="{{ url_for('auth.login_post', next=request.args.get('next')) }}">
        <div class="auth-field">
          <label class="auth-label">Usuario</label>
          <input class="auth-input" name="username" autocomplete="username" required autofocus>
        </div>

        <div class="auth-field">
          <label class="auth-label">Contraseña</label>
          <input class="auth-input" type="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="auth-actions">
          <button class="auth-btn" type="submit">Ingresar</button>
        </div>

        <div class="auth-hint">
          Si olvidó su contraseña, contacte a un ADMIN.
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
