{% extends "base.html" %}
{% set title = "Nueva Desvinculación" %}

{% block content %}
<div class="page">
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div>
          <h1 class="card-title">Nueva desvinculación</h1>
          <p class="card-subtitle">
            {{ trabajador.nombres }} {{ trabajador.ap_paterno }} {{ trabajador.ap_materno }}
            · Contrato vigente #{{ contrato.id }}
          </p>
        </div>
        <div style="display:flex; gap:8px;">
          <a class="btn btn-secondary" href="{{ url_for('trabajadores.detalle_trabajador', trabajador_id=trabajador.id) }}">Volver a ficha</a>
        </div>
      </div>

      <form method="post" action="{{ url_for('desvinculaciones.crear_desvinculacion', trabajador_id=trabajador.id) }}" class="form">
        <div class="form-grid">
          <div class="form-group">
            <label for="causal_id">Causal de término</label>
            <select name="causal_id" id="causal_id" required>
              <option value="">-- Seleccionar --</option>
              {% for c in causales %}
                <option value="{{ c.id }}">{{ c.id }} · {{ c.causal_resumida }} — {{ c.causal_finiquito }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="fecha_termino">Fecha de término</label>
            <input type="date" name="fecha_termino" id="fecha_termino" required>
          </div>

          <div class="form-group">
            <label for="fecha_aviso">Fecha de aviso (opcional)</label>
            <input type="date" name="fecha_aviso" id="fecha_aviso">
          </div>

          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="motivo_detalle">Motivo / detalle (opcional)</label>
            <textarea name="motivo_detalle" id="motivo_detalle" rows="3" placeholder="Ej: reestructuración, término de faena, renuncia presentada, etc."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <a class="btn btn-secondary" href="{{ url_for('trabajadores.detalle_trabajador', trabajador_id=trabajador.id) }}">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar borrador</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
