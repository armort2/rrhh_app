{% extends "base.html" %}

{% block title %}Nueva Obra · GRUPO CS{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div>
      <h1 class="card-title">Nueva Obra</h1>
      <p class="card-subtitle">
        Registra una nueva obra para asociar trabajadores y documentación.
      </p>
    </div>
  </div>

  <form method="post" class="form form-sectioned">
    <h2 class="section-title">Datos de la obra</h2>

    <div class="form-grid">
      <div class="form-group">
        <label for="codigo">Código</label>
        <input type="text" id="codigo" name="codigo" required placeholder="Ej: QNTO-01">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre de la obra</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Nombre descriptivo de la obra">
      </div>

      <div class="form-group">
        <label for="centro_costo">Centro de costo</label>
        <input type="text" id="centro_costo" name="centro_costo" placeholder="Ej: QUINTERO">
      </div>

      <div class="form-group">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Los Constructores 1234" maxlength="300">
      </div>

      <div class="form-group">
        <label for="comuna">Comuna</label>
        <input type="text" id="comuna" name="comuna" placeholder="Comuna donde se ejecuta la obra">
      </div>

      <div class="form-group">
        <label for="fecha_inicio">Fecha inicio</label>
        <input type="date" id="fecha_inicio" name="fecha_inicio">
      </div>

      <div class="form-group">
        <label for="fecha_cierre">Fecha cierre</label>
        <input type="date" id="fecha_cierre" name="fecha_cierre">
        <small class="help-text">
          Normalmente se completa al cerrar la obra.
        </small>
      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" name="estado">
          <option value="ACTIVA" selected>ACTIVA</option>
          <option value="CERRADA">CERRADA</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('obras.lista_obras') }}" class="btn btn-secondary">⬅ Volver</a>
      <button type="submit" class="btn btn-primary">Guardar obra</button>
    </div>
  </form>
</div>

<script>
  // UX simple: si el usuario marca CERRADA y no hay fecha_cierre, propone hoy.
  (function () {
    const estado = document.getElementById("estado");
    const cierre = document.getElementById("fecha_cierre");
    if (!estado || !cierre) return;

    function todayISO() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    estado.addEventListener("change", function () {
      if (estado.value === "CERRADA" && !cierre.value) {
        cierre.value = todayISO();
      }
      if (estado.value === "ACTIVA") {
        // No forzamos limpiar, pero suele ser lo correcto.
        // Si prefieres mantener valor manual, comenta esta línea.
        cierre.value = "";
      }
    });
  })();
</script>
{% endblock %}
